version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_db
    environment:
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: Admin_123
      POSTGRES_DB: url_shortener_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # - app
      - app1
      - app2
      - app3

  app1:
    build: .
    environment:
      DB_USER: Admin
      DB_PASSWORD: Admin_123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  app2:
    build: .
    environment:
      DB_USER: Admin
      DB_PASSWORD: Admin_123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  app3:
    build: .
    environment:
      DB_USER: Admin
      DB_PASSWORD: Admin_123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

