events {}

http {
    access_log /var/log/nginx/access.log;

    upstream node_backend {
        # server app:3000;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://node_backend;
        }
    }
}